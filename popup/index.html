<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ghoti</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="logo">
    <img src="../assets/logo_128.png" alt="Extension Logo">
  </div>
  <div class="hamburger-container">
    <img src="../assets/hbg.png" alt="Hamburger Icon">

  </div>
  <div class="section">
    <br>
    <label for="slider1"><h5>Yerel Eşik</h5></label>
    <input type="range" id="slider1" name="slider1" min="0" max="100" value="30">
    <br>

    <label for="slider2"><h5>Genel Eşik</h5></label>
    <input type="range" id="slider2" name="slider2" min="0" max="100" value="60">
  </div>
  <div class="section checkbox-container">
    <label><input type="checkbox" id="checkbox1"><h5>Şüpheli bulunursa oran gösterilsin.</h5></label><br>
    <label><input type="checkbox" id="checkbox2"><h5>Güven oranı her zaman gösterilsin.</h5></label><br>
    <label><input type="checkbox" id="checkbox3"><h5>Taranana kadar erişim engellensin.</h5></label>
    <br>

    <label><input type="checkbox" id="checkbox3"><h5>Taranan sayfalar bir süre yeniden taranmasın.</h5></label>
  </div>
  <div class="section buttons">
    <button id="btn1">Sayfayı Bildir</button>
    <button id="btn2">Yeniden Tara</button>
    <button id="btn3">Ayarlar</button>
  </div>
</body>
</html>
